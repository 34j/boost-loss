[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "boost-loss"
version = "1.0.0"
description = "Utilities for easy use of custom losses in CatBoost, LightGBM, XGBoost"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "attrs>=23.1,<24",
  "catboost>=1.2.10,<2",
  "lightgbm>=4,<5",
  "pyhumps>=3.8,<4",
  "scikit-learn>=1.3.2,<2",
  "xgboost>=2,<3",
]
optional-dependencies.torch = [
  "torch>=2.0.1,<3",
]
urls."Bug Tracker" = "https://github.com/34j/boost-loss/issues"
urls.Changelog = "https://github.com/34j/boost-loss/blob/main/CHANGELOG.md"
urls.documentation = "https://boost-loss.readthedocs.io"
urls.repository = "https://github.com/34j/boost-loss"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "parameterized",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.ignore = [
  "A001",
  "ARG002",
  "B008",
  "B017",
  "B019",
  "B024",
  "B904",
  "C901",
  "D",
  "DOC",
  "E501",
  "FBT",
  "N",
  "NPY002",
  "PGH003",
  "PLC2701",
  "PLR2004",
  "PLR6301",
  "PLW3201",
  "PT",
  "RUF012",
  "RUF067",
  "SLF001",
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
ini_options.addopts = "-v -Wdefault --cov=boost_loss --cov-report=term-missing:skip-covered"
ini_options.testpaths = [ "tests/" ]
ini_options.pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]
