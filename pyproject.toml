[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "boost-loss"
version = "0.5.5"
description = "Utilities for easy use of custom losses in CatBoost, LightGBM, XGBoost"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "attrs>=23.1.0,<24.0.0",
  "catboost>=1.2,<2.0.0",
  "lightgbm>=4.0.0,<5.0.0",
  "pyhumps>=3.8.0,<4.0.0",
  "scikit-learn>=1.3.2,<2.0.0",
  "xgboost>=2.0.0,<3.0.0",
]
urls."Bug Tracker" = "https://github.com/34j/boost-loss/issues"
urls.Changelog = "https://github.com/34j/boost-loss/blob/main/CHANGELOG.md"
urls.documentation = "https://boost-loss.readthedocs.io"
urls.repository = "https://github.com/34j/boost-loss"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "parameterized",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]
torch = [
  "torch>=2.0.1,<3.0.0",
]

[tool.pytest]
ini_options.addopts = "-v -Wdefault --cov=boost_loss --cov-report=term-missing:skip-covered"
ini_options.testpaths = "tests/"
ini_options.pythonpath = [ "src" ]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "@overload",
  "if TYPE_CHECKING",
  "raise NotImplementedError",
  "if __name__ == \"__main__\":",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
